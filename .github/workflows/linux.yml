name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: GCC 13 x64 Release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # System libraries that vcpkg's Qt6, OpenCASCADE, and lapack-reference
      # expect to find via pkg-config / find_package on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config gfortran \
            autoconf autoconf-archive automake libtool libltdl-dev \
            libgl-dev libglu1-mesa-dev libdrm-dev libgbm-dev libegl-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxrender-dev \
            libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libxfixes-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-util-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxcb-cursor-dev libxcb-xinput-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev \
            libsm-dev libice-dev \
            libdbus-1-dev

      # Install in classic mode (--classic) so vcpkg ignores the builtin-baseline
      # in vcpkg.json and avoids shallow-clone git-show failures on the CI runner.
      - name: Install vcpkg dependencies
        uses: johnwason/vcpkg-action@v8
        with:
          pkgs: >-
            fcl bullet3[multithreading,double-precision,rtti] octomap console-bridge
            eigen3 yaml-cpp benchmark tinyxml2 assimp orocos-kdl pcl lapack-reference
            cereal boost-dll boost-filesystem boost-program-options boost-graph boost-logic
            boost-stacktrace urdfdom ccd[double-precision] gtest catch2
            spdlog tracy flecs opencascade qtbase
          triplet: x64-linux-release
          extra-args: --classic --clean-after-build --overlay-triplets=${{ github.workspace }}/cmake/triplets
          token: ${{ github.token }}
          revision: '8528134bac3d39db8d36f4097755a97a1394e4dc'
          cache-key: cellforge-vcpkg-ubuntu-24.04-v5

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-release \
            "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets" \
            -DVCPKG_MANIFEST_MODE=OFF

      - name: Build
        run: cmake --build build --config Release

      # Add tesseract and vcpkg shared library directories to the loader search path before running tests — the test
      # binaries are not installed (and so carry no RPATH to these locations), so the dynamic linker cannot otherwise
      # find libtesseract_*.so / vcpkg .so dependencies at runtime.
      - name: Test
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/build/vendor_install/lib:${{ github.workspace }}/vcpkg/installed/x64-linux-release/lib:$LD_LIBRARY_PATH"
          ctest --test-dir build/tests_build --output-on-failure -C Release
