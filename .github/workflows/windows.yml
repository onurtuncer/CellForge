name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSVC 2022 x64 Release
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Install in classic mode (--classic) so vcpkg ignores the builtin-baseline
      # in vcpkg.json and avoids shallow-clone git-show failures on the CI runner.
      - name: Install vcpkg dependencies
        uses: johnwason/vcpkg-action@v8
        with:
          pkgs: >-
            fcl bullet3[multithreading,double-precision,rtti] octomap console-bridge
            eigen3 yaml-cpp benchmark tinyxml2 assimp orocos-kdl pcl lapack-reference
            cereal boost-dll boost-filesystem boost-program-options boost-graph
            boost-stacktrace boost-logic urdfdom ccd[double-precision] gtest catch2
            spdlog tracy flecs opencascade qtbase
          triplet: x64-windows-release
          extra-args: --classic --clean-after-build --overlay-triplets=${{ github.workspace }}/cmake/triplets
          token: ${{ github.token }}
          revision: '8528134bac3d39db8d36f4097755a97a1394e4dc'
          cache-key: cellforge-vcpkg-windows-2022-v4

      # Put cl.exe / nmake.exe / ninja.exe on PATH
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}\cmake\triplets" `
            -DVCPKG_MANIFEST_MODE=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      # Add tesseract and vcpkg DLL directories to PATH before running tests
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\build\vendor_install\bin;" +
                      "${{ github.workspace }}\vcpkg\installed\x64-windows-release\bin;" +
                      $env:PATH
          ctest --test-dir build/tests_build --output-on-failure -C Release
